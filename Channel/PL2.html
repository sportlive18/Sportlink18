<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Nick Plus (Digital) · Hotstar</title>
    <meta name="referrer" content="no-referrer">

    <!-- Shaka Player (UI + core) -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js">
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css" />

    <style>
        /* ----- RESET & FULLSCREEN LAYOUT ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .shaka-video-container {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* ----- CUSTOM WATERMARK (Nick Plus) ----- */
        .custom-watermark {
            position: absolute;
            z-index: 40;
            pointer-events: none;
            top: 65%;
            left: 6%;
            transform: translateY(-50%);
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.20);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }
        .custom-watermark span {
            color: rgba(255, 255, 255, 0.30);
        }
        .custom-watermark .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 80, 80, 0.6);
            margin-right: 8px;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(1.5);
            }
        }

        /* ----- MODERN BLOCKER (sandbox fallback) ----- */
        .block-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            text-align: center;
        }
        .block-box {
            padding: 40px;
            max-width: 500px;
            width: 90%;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .block-title {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.25);
        }
        .block-sub {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.7;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 700px) {
            .custom-watermark {
                font-size: 10px;
                top: 60%;
                left: 16%;
            }
            .block-title {
                font-size: 24px;
            }
            .block-box {
                padding: 25px;
            }
            .block-sub {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- PLAYER CONTAINER -->
    <div class="shaka-video-container" id="player-container">
        <video id="video" autoplay muted playsinline preload="metadata"></video>
        <div class="custom-watermark">
            <span class="dot"></span>Nick Plus <span>· Digital</span>
        </div>
    </div>

    <script>
        (function() {

            // ----- SANDBOX DETECTION (keep user informed) -----
            function isSandboxedEnv() {
                try {
                    if (window.self === window.top) return false;
                    if (window.frameElement && window.frameElement.hasAttribute("sandbox")) {
                        return true;
                    }
                    try {
                        document.domain = document.domain;
                        if (window.frameElement && !window.frameElement.getAttribute("sandbox")) {
                            return false;
                        }
                    } catch (_) {
                        return true;
                    }
                    return false;
                } catch (_) {
                    return true;
                }
            }

            function triggerBlockScreen(title, message) {
                const container = document.getElementById("player-container");
                const video = document.getElementById("video");
                try {
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                } catch (_) {}

                const overlay = document.createElement("div");
                overlay.className = "block-overlay";
                overlay.id = "sandbox-block-display";
                overlay.innerHTML = `
              <div class="block-box">
                <div class="block-title">${title}</div>
                <div class="block-sub">${message}</div>
              </div>
            `;
                document.body.appendChild(overlay);
                container.style.display = 'none';
            }

            if (isSandboxedEnv()) {
                triggerBlockScreen('Disable Sandbox', 'Open in a normal browser tab & disable ad blockers.');
                return;
            }

            // ----- CONFIGURATION – Hotstar stream (Nick Plus) -----
            const CONFIG = {
                // MPD from the M3U entry
                streamUrl: "https://livetv.hotstar.com/mp1/gec-india-1540074047/22c4e4fc4e8c4a1897019c4c6ad698c2/index.mpd?a=ns&ttl=86400",
                // ClearKey: keyId:key  (from #KODIPROP:inputstream.adaptive.license_key)
                keyId: "8446d54c24f549ba9c9323836a060000",
                key: "db25bb59ba41470e82e4728f46781954",
                // Headers from #EXTHTTP and #EXTVLCOPT
                cookie: "hdntl=exp=1786366813~acl=%2f*~id=65900ec1ddc75624f5b79c59ee0885e6~data=hdntl~hmac=c95baf04bca98749e4860775051283cfc57cc9a4a96ab78da0d57b966c055b2a",
                userAgent: "Hotstar;in.startv.hotstar/25.02.24.8.11169 (Android/11)",
                referer: "https://www.hotstar.com/",
                origin: "https://www.hotstar.com/"
            };

            // ----- BOOT PLAYER -----
            document.addEventListener("DOMContentLoaded", async () => {

                // Install polyfills
                shaka.polyfill.installAll();
                if (!shaka.Player.isBrowserSupported()) return;

                const video = document.getElementById("video");
                const container = document.getElementById("player-container");

                // Ensure muted to allow autoplay
                video.muted = true;

                // Create player + UI
                const player = new shaka.Player();
                await player.attach(video);

                const ui = new shaka.ui.Overlay(player, container, video);

                // Configure UI controls
                ui.configure({
                    addBigPlayButton: true,
                    controlPanelElements: [
                        "mute",
                        "play_pause",
                        "time_and_duration",
                        "spacer",
                        "quality",
                        "picture_in_picture",
                        "fullscreen"
                    ],
                    seekBarColors: {
                        base: "white",
                        buffered: "red",
                        played: "green"
                    }
                });

                // ----- DRM: ClearKey -----
                player.configure({
                    drm: {
                        clearKeys: {
                            [CONFIG.keyId]: CONFIG.key
                        }
                    },
                    manifest: {
                        defaultPresentationDelay: 5
                    },
                    streaming: {
                        lowLatencyMode: true,
                        bufferingGoal: 10,
                        rebufferingGoal: 2,
                        safeSeekOffset: 5
                    }
                });

                // ----- REQUEST FILTER: add required headers (Cookie, User-Agent, Referer, Origin) -----
                const netEngine = player.getNetworkingEngine();
                if (netEngine) {
                    netEngine.registerRequestFilter((type, request) => {
                        // Always add the core headers
                        request.headers["Cookie"] = CONFIG.cookie;
                        request.headers["User-Agent"] = CONFIG.userAgent;
                        request.headers["Referer"] = CONFIG.referer;
                        request.headers["Origin"] = CONFIG.origin;

                        // For manifest and segment requests, also append cookie as URL param if needed
                        // Some Hotstar streams expect the cookie in the URL as well.
                        // We'll add it as a query param for safety (some CDNs require it).
                        if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                            type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
                            // Only add if not already present
                            if (!request.uris[0].includes("hdntl=")) {
                                const sep = request.uris[0].includes("?") ? "&" : "?";
                                // Extract just the hdntl value from the full cookie
                                const match = CONFIG.cookie.match(/hdntl=([^;~]+)/);
                                if (match) {
                                    request.uris[0] += sep + "hdntl=" + encodeURIComponent(match[1]);
                                }
                            }
                        }
                    });
                }

                // ----- LOAD STREAM -----
                try {
                    await player.load(CONFIG.streamUrl);
                    // Unmute after user interaction (autoplay with audio may be blocked)
                    video.play().catch(() => {});
                } catch (e) {
                    console.warn("Player load error:", e);
                    // Show a user-friendly error in the UI
                    const overlay = document.createElement("div");
                    overlay.className = "block-overlay";
                    overlay.innerHTML = `
                <div class="block-box">
                  <div class="block-title">⚠️ Stream Error</div>
                  <div class="block-sub">Could not load the stream. Please check your connection or try again later.</div>
                </div>
              `;
                    document.body.appendChild(overlay);
                    container.style.display = 'none';
                }

                // Once user interacts, unmute
                const unmuteOnInteraction = () => {
                    video.muted = false;
                    video.play().catch(() => {});
                    document.removeEventListener("click", unmuteOnInteraction);
                    document.removeEventListener("touchstart", unmuteOnInteraction);
                };
                document.addEventListener("click", unmuteOnInteraction);
                document.addEventListener("touchstart", unmuteOnInteraction);

                // Also unmute when the video plays
                video.addEventListener("play", () => {
                    video.muted = false;
                });

            });

        })();
    </script>

</body>
</html>
