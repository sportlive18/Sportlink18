<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Star Sports 2 (Digital) · Hotstar</title>
    <meta name="referrer" content="no-referrer">

    <!-- Shaka Player (UI + core) -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js">
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .shaka-video-container {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .custom-watermark {
            position: absolute;
            z-index: 40;
            pointer-events: none;
            top: 65%;
            left: 6%;
            transform: translateY(-50%);
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.20);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }
        .custom-watermark span {
            color: rgba(255, 255, 255, 0.30);
        }
        .custom-watermark .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 200, 0, 0.7);
            margin-right: 8px;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(1.5);
            }
        }

        .block-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            text-align: center;
            padding: 20px;
        }
        .block-box {
            padding: 40px;
            max-width: 550px;
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .block-title {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .block-title .error-icon {
            display: block;
            font-size: 48px;
            margin-bottom: 8px;
        }
        .block-sub {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.7;
            word-break: break-word;
        }
        .block-sub code {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #ff8a8a;
            margin-top: 8px;
            max-width: 100%;
            overflow-wrap: break-word;
        }
        .block-sub .hint {
            display: block;
            margin-top: 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 700px) {
            .custom-watermark {
                font-size: 10px;
                top: 60%;
                left: 16%;
            }
            .block-title {
                font-size: 22px;
            }
            .block-box {
                padding: 25px;
            }
            .block-sub {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="shaka-video-container" id="player-container">
        <video id="video" autoplay muted playsinline preload="metadata"></video>
        <div class="custom-watermark">
            <span class="dot"></span>Star Sports 2 <span>· Digital</span>
        </div>
    </div>

    <script>
        (function() {

            // ----- Error overlay (no sandbox check) -----
            function showBlockScreen(title, message, extra) {
                const container = document.getElementById("player-container");
                const video = document.getElementById("video");
                try {
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                } catch (_) {}

                const overlay = document.createElement("div");
                overlay.className = "block-overlay";
                overlay.id = "block-display";
                overlay.innerHTML = `
                    <div class="block-box">
                        <div class="block-title">
                            <span class="error-icon">⚠️</span>
                            ${title}
                        </div>
                        <div class="block-sub">
                            ${message}
                            ${extra ? `<code>${extra}</code>` : ''}
                            <span class="hint">🔄 Try reloading the page or check the stream token.</span>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                if (container) container.style.display = 'none';
            }

            // ----- CONFIGURATION – Hotstar stream (Star Sports 2) -----
            const CONFIG = {
                streamUrl: "https://premiumplugx.top/yash/hotstar.php/Star-Sports-2-Digital.mpd",
                keyId: "14d0c8ee09944c32bafea44a987d0000",
                key: "74d35f4034b14854bd3ca83dd3aa2fb1",
                cookie: "",
                userAgent: "Hotstar;in.startv.hotstar/25.02.24.8.11169 (Android/11)",
                referer: "https://www.hotstar.com/"
            };

            // ----- BOOT PLAYER -----
            document.addEventListener("DOMContentLoaded", async () => {

                shaka.polyfill.installAll();
                if (!shaka.Player.isBrowserSupported()) {
                    showBlockScreen(
                        'Browser Not Supported',
                        'Your browser does not support the required media features.'
                    );
                    return;
                }

                const video = document.getElementById("video");
                const container = document.getElementById("player-container");
                video.muted = true;

                const player = new shaka.Player();
                try {
                    await player.attach(video);
                } catch (e) {
                    showBlockScreen(
                        'Player Init Error',
                        'Failed to attach player to video element.',
                        e.message || String(e)
                    );
                    return;
                }

                const ui = new shaka.ui.Overlay(player, container, video);
                ui.configure({
                    addBigPlayButton: true,
                    controlPanelElements: [
                        "mute",
                        "play_pause",
                        "time_and_duration",
                        "spacer",
                        "quality",
                        "picture_in_picture",
                        "fullscreen"
                    ],
                    seekBarColors: {
                        base: "white",
                        buffered: "red",
                        played: "green"
                    }
                });

                // ----- DRM: ClearKey -----
                player.configure({
                    drm: {
                        clearKeys: {
                            [CONFIG.keyId]: CONFIG.key
                        }
                    },
                    manifest: {
                        defaultPresentationDelay: 5
                    },
                    streaming: {
                        lowLatencyMode: true,
                        bufferingGoal: 10,
                        rebufferingGoal: 2,
                        safeSeekOffset: 5
                    },
                    networking: {
                        credentials: 'include'
                    }
                });

                // ----- REQUEST FILTER: add required headers -----
                const netEngine = player.getNetworkingEngine();
                if (netEngine) {
                    netEngine.registerRequestFilter((type, request) => {
                        request.headers["Cookie"] = CONFIG.cookie;
                        request.headers["User-Agent"] = CONFIG.userAgent;
                        request.headers["Referer"] = CONFIG.referer;
                        // Origin is not set programmatically; browser handles it.
                    });
                }

                // ----- LOAD STREAM -----
                try {
                    console.log("[Star Sports 2] Loading:", CONFIG.streamUrl);
                    await player.load(CONFIG.streamUrl);
                    video.play().catch(() => {});
                    console.log("[Star Sports 2] ✅ Stream loaded successfully");
                } catch (e) {
                    console.error("[Star Sports 2] ❌ Load error:", e);

                    let errorMsg = e.message || String(e);
                    let detail = "";

                    if (e.code !== undefined) {
                        const codeMap = {
                            1000: "MANIFEST_LOAD_FAILED",
                            1001: "MANIFEST_PARSE_FAILED",
                            1002: "MANIFEST_INVALID",
                            3000: "LICENSE_REQUEST_FAILED",
                            3001: "LICENSE_RESPONSE_INVALID",
                            3002: "LICENSE_PARSING_FAILED",
                            4000: "VIDEO_ERROR",
                            5000: "NETWORK_ERROR",
                            6000: "SEGMENT_LOAD_FAILED"
                        };
                        const codeName = codeMap[e.code] || `ERROR_${e.code}`;
                        detail = `[${codeName}]`;
                        if (e.data && e.data.length) {
                            const extra = e.data.map(d => String(d)).join(' ');
                            detail += ` ${extra}`;
                        }
                    }

                    let userMessage = 'Could not load the stream. The token may have expired or the stream is unavailable.';
                    if (e.code === 1002 && errorMsg.includes('Failed to fetch')) {
                        userMessage = 'The manifest request was blocked (CORS or network error). Try using a CORS proxy or disable browser security for testing.';
                    }

                    showBlockScreen(
                        'Stream Error',
                        userMessage,
                        `${detail} ${errorMsg}`
                    );
                    return;
                }

                // Unmute on user interaction
                const unmuteOnInteraction = () => {
                    video.muted = false;
                    video.play().catch(() => {});
                    document.removeEventListener("click", unmuteOnInteraction);
                    document.removeEventListener("touchstart", unmuteOnInteraction);
                };
                document.addEventListener("click", unmuteOnInteraction);
                document.addEventListener("touchstart", unmuteOnInteraction);
                video.addEventListener("play", () => {
                    video.muted = false;
                });

            });

        })();
    </script>

</body>
</html>
